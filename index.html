            const clean = chiefComplaint.replace(/^\d+\.\s*/, '').trim();
            return CLINICAL_GUIDELINES.find(g =>

                clean.includes(g.主訴) ||

            if (customFindings && customFindings[item] !== undefined && customFindings[item] !== "") {
                return customFindings[item];
            }
            if (!patientInfo) return "所見なし";
            const cleanItem = item.replace(/（.*?）/g, "").trim();

            if (cleanItem.includes("既往") && patientInfo.pmh) return patientInfo.pmh;
            if (cleanItem.includes("家族") && patientInfo.familyHistory) return patientInfo.familyHistory;
            if ((cleanItem.includes("生活") || cleanItem.includes("嗜好") || cleanItem.includes("環境") || cleanItem.includes("職業")) && patientInfo.background) return patientInfo.background;
            if (cleanItem.includes("解釈") && patientInfo.explanatoryModel) return patientInfo.explanatoryModel;
            if (cleanItem.includes("受療") && patientInfo.careBehavior) return patientInfo.careBehavior;

            const allText = [
                patientInfo.hpi || "",
                patientInfo.pmh || "",
                patientInfo.background || "",
                patientInfo.careBehavior || "",
                patientInfo.explanatoryModel || ""
            ].join("\n");

            const sentences = allText.split(/[。\n]/).filter(Boolean);
            const matched = sentences.filter(s => s.includes(cleanItem) || (cleanItem.length >= 2 && s.includes(cleanItem.slice(0, 2))));

            if (matched.length > 0) {
                return matched.join("。") + "。";
            }

            return "所見なし";
        }

        // 主訴別の身体診察ポイントの所見を取得するヘルパー（カスタム所見を最優先）
        function getExamFinding(item, physicalExam, customFindings) {
            if (customFindings && customFindings[item] !== undefined && customFindings[item] !== "") {
                return customFindings[item];
            }
            if (!physicalExam) return "所見なし";
            const findings = physicalExam.findings || {};
            const vitals = physicalExam.vitals || {};
            const cleanItem = item.replace(/（.*?）/g, "").trim();

            if (cleanItem.includes("バイタル")) {
                return `意識: ${vitals.consciousness || '正常'}, 体温: ${vitals.temp || '正常'}, 脈拍: ${vitals.pulse || '正常'}, 血圧(左): ${vitals.bpLeft || vitals.bp || '正常'}, 呼吸数: ${vitals.resp || '正常'}, SpO2: ${vitals.spo2 || '正常'}`;
            }
            if (cleanItem.includes("意識")) {
                return vitals.consciousness ? `意識状態: ${vitals.consciousness}` : "所見なし";
            }
            if (cleanItem.includes("血圧左右差")) {
                return `血圧(左): ${vitals.bpLeft || '未測定'}, 血圧(右): ${vitals.bpRight || '未測定'}`;
            }

            const allFindings = [
                { text: findings.headNeck || "" },
                { text: findings.chest || "" },
                { text: findings.abdomen || "" },
                { text: findings.extremities || "" },
                { text: findings.other || "" }
            ];

            let results = [];
            for (const f of allFindings) {
                if (f.text && (f.text.includes(cleanItem) || (cleanItem.length >= 2 && f.text.includes(cleanItem.slice(0, 2))))) {
                    const sentences = f.text.split(/[。\n]/).filter(Boolean);
                    const matchedSentences = sentences.filter(s => s.includes(cleanItem) || (cleanItem.length >= 2 && s.includes(cleanItem.slice(0, 2))));
                    if (matchedSentences.length > 0) {
                        results.push(matchedSentences.join("。") + "。");
                    } else {
                        results.push(f.text);
                    }
                }
            }

            if (results.length > 0) {
                return Array.from(new Set(results)).join("\n");
            }

            return "所見なし";
        }

        function SoloModeScreen({ currentCase, onBack }) {
            const [revealed, setRevealed] = useState(new Set());

            const [timerSeconds, setTimerSeconds] = useState(720); // 12分 = 720秒
            const [isTimerRunning, setIsTimerRunning] = useState(false);

            const guideline = useMemo(() => getGuideline(currentCase.initialInfo.chiefComplaint), [currentCase]);

            // Web Audio API によるビープ音発音関数 (ブラウザのサスペンド制限解除に対応)
            const playBeepSound = (freq = 880, duration = 0.3, count = 1) => {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    if (!window.globalAudioCtx) {
                        window.globalAudioCtx = new AudioCtx();
                    }
                    const ctx = window.globalAudioCtx;
                    if (ctx.state === 'suspended') {
                        ctx.resume();
                    }
                    
                    const triggerBeep = (delay) => {
                        setTimeout(() => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.setValueAtTime(freq, ctx.currentTime);
                            gain.gain.setValueAtTime(0.5, ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.start();
                            osc.stop(ctx.currentTime + duration);
                        }, delay * 1000);
                    };

                    for (let i = 0; i < count; i++) {
                        triggerBeep(i * (duration + 0.15));
                    }
                } catch (e) {
                    console.error("Audio Context Error", e);
                }
            };

            // スタート/一時停止切り替え時に AudioContext を有効化
            const toggleTimer = () => {
                if (!isTimerRunning) {
                    try {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        if (AudioCtx) {
                            if (!window.globalAudioCtx) {
                                window.globalAudioCtx = new AudioCtx();
                            }
                            if (window.globalAudioCtx.state === 'suspended') {
                                window.globalAudioCtx.resume();
                            }
                        }
                    } catch (e) {
                        console.error(e);
                    }

                setIsTimerRunning(!isTimerRunning);
            };

            // タイマーモード変更処理
            const changeTimerMode = (mode) => {
                setIsTimerRunning(false);
                setTimerMode(mode);
                warnedRef.current = false;
                finishedRef.current = false;
                setTimerAlertState("normal");
                if (mode === "12min") setTimerSeconds(720);
                else if (mode === "4min") setTimerSeconds(240);
                else setTimerSeconds(0); // countup
            };

            // タイマーカウント制御処理
            useEffect(() => {
                let interval;
                if (isTimerRunning) {
                    interval = setInterval(() => {
                        setTimerSeconds(prev => {
                            if (timerMode === "countup") {
                                return prev + 1;
                            } else {
                                if (prev <= 1) {
                                    setIsTimerRunning(false);
                                    if (!finishedRef.current) {
                                        finishedRef.current = true;
                                        setTimerAlertState("finished");
                                        playBeepSound(1046.5, 0.4, 3); // タイムアップ音 (高いド×3回)
                                    }
                                    return 0;
                                }
                                const nextSec = prev - 1;
                                // 残り1分 (60秒) アラート
                                if (nextSec <= 60 && !warnedRef.current) {
                                    warnedRef.current = true;
                                    setTimerAlertState("warning");
                                    playBeepSound(659.25, 0.4, 2); // 1分前通知音 (ミ×2回)
                                }
                                return nextSec;
                            }
                        });

                return () => clearInterval(interval);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);

            const toggleReveal = (key) => {
                setRevealed(prev => {

                    if (next.has(key)) {
                        next.delete(key);

                    return next;

            const revealAll = () => {

        function CaseManagerScreen({ cases, setCases, onEditCase, onCreateCase, onClearCache }) {
            const exportJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cases, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `clinical_cases_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const importJSON = (event) => {
                const fileReader = new FileReader();
                if (event.target.files && event.target.files[0]) {
                    fileReader.readAsText(event.target.files[0], "UTF-8");
                    fileReader.onload = (e) => {
                        try {
                            const parsed = JSON.parse(e.target.result);
                            if (Array.isArray(parsed)) {
                                setCases(parsed);
                                alert("症例データを正常に読み込みました。");
                            } else {
                                alert("無効なJSONフォーマットです。");
                            }
                        } catch (err) {
                            alert("JSONファイルの読み込みエラーが発生しました。");
                        }
                    };
                }
            };

            const deleteCase = (id) => {
                if (confirm("この症例を削除してもよろしいですか？")) {
                    setCases(cases.filter(c => c.id !== id));
                }
            };

            return (
                <div class="max-w-6xl mx-auto px-4 py-8 animate-fade-in custom-scrollbar">
                    <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">症例データベース管理</h2>
                            <p class="text-xs text-slate-500">登録済み症例の追加・編集・エクスポートが行えます。</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <button onClick={onClearCache} class="px-3 py-2 bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold rounded-xl border border-amber-300 transition-colors flex items-center gap-1.5">
                                <i class="fa-solid fa-rotate"></i> キャッシュクリア
                            </button>
                            <label class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl cursor-pointer transition-colors flex items-center gap-1.5">
                                <i class="fa-solid fa-file-import"></i> インポート
                                <input type="file" accept=".json" onChange={importJSON} class="hidden" />
                            </label>
                            <button onClick={exportJSON} class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-colors flex items-center gap-1.5">
                                <i class="fa-solid fa-file-export"></i> エクスポート
                            </button>
                            <button onClick={onCreateCase} class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl shadow-md transition-all flex items-center gap-1.5">
                                <i class="fa-solid fa-plus"></i> 新規症例作成
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {cases.map((c) => (
                            <div key={c.id} class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition-shadow">
                                <div class="space-y-3">
                                    <div class="flex items-center justify-between">
                                        <span class="px-2 py-0.5 bg-teal-50 text-teal-700 text-[10px] font-bold rounded border border-teal-200/50">
                                            {c.initialInfo.chiefComplaint}
                                        </span>
                                        <button onClick={() => deleteCase(c.id)} class="text-slate-400 hover:text-rose-600 text-xs p-1">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </div>

                                    <div>
                                        <h3 class="font-bold text-slate-800 text-base">{c.initialInfo.name}</h3>
                                        <p class="text-xs text-slate-500">{c.initialInfo.age} 歳 / {c.initialInfo.gender}</p>
                                    </div>

                                    <p class="text-xs text-slate-600 line-clamp-2 bg-slate-50 p-2 rounded-lg border border-slate-100">
                                        {c.hiddenSettings.aim}
                                    </p>
                                </div>

                                <div class="pt-4 mt-4 border-t border-slate-100 flex items-center justify-end">
                                    <button 
                                        onClick={() => onEditCase(c)}
                                        class="px-3 py-1.5 bg-slate-900 hover:bg-black text-white text-xs font-bold rounded-lg transition-colors flex items-center gap-1"
                                    >
                                        <i class="fa-solid fa-pen"></i> 編集
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>

                                <div><label class="block text-xs font-bold text-slate-500">1. 頭頸部</label><input type="text" value={formData.physicalExam.findings.headNeck} onChange={e => setFormData({...formData, physicalExam: {...formData.physicalExam, findings: {...formData.physicalExam.findings, headNeck: e.target.value}}})} class="w-full p-2 text-xs border rounded-lg" /></div>
                                <div><label class="block text-xs font-bold text-slate-500">2. 胸部 (所見)</label><input type="text" value={formData.physicalExam.findings.chest} onChange={e => setFormData({...formData, physicalExam: {...formData.physicalExam, findings: {...formData.physicalExam.findings, chest: e.target.value}}})} class="w-full p-2 text-xs border rounded-lg" /></div>
                                <div><label class="block text-xs font-bold text-slate-500">3. 腹部</label><input type="text" value={formData.physicalExam.findings.abdomen} onChange={e => setFormData({...formData, physicalExam: {...formData.physicalExam, findings: {...formData.physicalExam.findings, abdomen: e.target.value}}})} class="w-full p-2 text-xs border rounded-lg" /></div>
                                <div><label class="block text-xs font-bold text-slate-500">4. 四肢</label><input type="text" value={formData.physicalExam.findings.extremities} onChange={e => setFormData({...formData, physicalExam: {...formData.physicalExam, findings: {...formData.physicalExam.findings, extremities: e.target.value}}})} class="w-full p-2 text-xs border rounded-lg" /></div>
                                <div class="sm:col-span-2"><label class="block text-xs font-bold text-slate-500">5. その他</label><input type="text" value={formData.physicalExam.findings.other} onChange={e => setFormData({...formData, physicalExam: {...formData.physicalExam, findings: {...formData.physicalExam.findings, other: e.target.value}}})} class="w-full p-2 text-xs border rounded-lg" /></div>
                            </div>

                            <div class="pt-3 border-t border-slate-100 space-y-3">
                                <h4 class="text-xs font-bold text-indigo-800 flex items-center gap-1.5">
                                    <i class="fa-solid fa-music"></i> 胸部 聴診音URL (未入力の場合はデフォルト正常音を再生)
                                </h4>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-[10px] text-slate-500 font-bold mb-1">心音オーディオURL (.mp3 / .ogg)</label>
                                        <input type="url" placeholder="未入力で正常音再生" value={formData.physicalExam.audio?.heartSoundUrl || ""} onChange={e => setFormData({...formData, physicalExam: {...formData.physicalExam, audio: {...(formData.physicalExam.audio || {}), heartSoundUrl: e.target.value}}})} class="w-full p-2 text-xs border rounded-lg" />
                                    </div>
                                    <div>
                                        <label class="block text-[10px] text-slate-500 font-bold mb-1">呼吸音オーディオURL (.mp3 / .ogg)</label>
                                        <input type="url" placeholder="未入力で正常音再生" value={formData.physicalExam.audio?.breathSoundUrl || ""} onChange={e => setFormData({...formData, physicalExam: {...formData.physicalExam, audio: {...(formData.physicalExam.audio || {}), breathSoundUrl: e.target.value}}})} class="w-full p-2 text-xs border rounded-lg" />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-end gap-3 pt-4">
                            <button type="button" onClick={onCancel} class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-colors">
                                キャンセル
                            </button>
                            <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl shadow-md transition-all">
                                保存する
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        function App() {
            const [cases, setCases] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [activeTab, setActiveTab] = useState("home");
            const [selectedCase, setSelectedCase] = useState(null);
            const [editingCase, setEditingCase] = useState(null);
            const [toast, setToast] = useState(null);

            // 症例データ読み込み関数 (キャッシュバスターパラメータ _t を追加)
            const loadCasesData = async (forceClearCache = false) => {
                setIsLoading(true);

                if (forceClearCache) {
                    localStorage.removeItem("clinical_sp_cases");
                } else {
                    const saved = localStorage.getItem("clinical_sp_cases");
                    if (saved) {
                        try {
                            const parsed = JSON.parse(saved);
                            if (Array.isArray(parsed) && parsed.length > 0) {
                                setCases(parsed);
                                setIsLoading(false);
                                return;
                            }
                        } catch (e) {
                            console.error("Failed to parse localStorage cases", e);
                        }
                    }
                }

                // タイムスタンプ付与でブラウザのHTTPキャッシュを強制回避
                const cacheBusterUrl = `cases.json?_t=${Date.now()}`;
                const isBlobUrl = window.location.href.startsWith("blob:");

                if (!isBlobUrl) {
                    try {
                        const response = await fetch(cacheBusterUrl, {
                            cache: 'no-store',
                            headers: {
                                'Cache-Control': 'no-cache'
                            }
                        });
                        if (response.ok) {
                            const data = await response.json();
                            if (Array.isArray(data) && data.length > 0) {
                                setCases(data);
                                setIsLoading(false);
                                return;
                            }
                        }
                    } catch (err) {
                        console.warn("cases.json fetch failed, using default embedded cases:", err);
                    }
                }

                setCases(DEFAULT_CASES);
                setIsLoading(false);
            };

            useEffect(() => {
                loadCasesData();
            }, []);

            const showToast = (message, type = "success") => {
                setToast({ message, type });
            };

            // 手動キャッシュクリア処理
            const handleClearCache = () => {
                if (confirm("ブラウザに保存された一時データとキャッシュをクリアし、サーバーから最新の cases.json を再読み込みしますか？")) {
                    loadCasesData(true);
                    showToast("キャッシュと保存データをクリアし、最新データをロードしました。");
                }
            };

            const handleStartSolo = (c) => {
                setSelectedCase(c);
                setActiveTab("solo");
            };

            const handleStartPair = (c) => {
                setSelectedCase(c);
                setActiveTab("pair");
            };

            const handleSaveCase = (savedCase) => {
                const updatedCases = (() => {
                    const idx = cases.findIndex(c => c.id === savedCase.id);
                    if (idx >= 0) {
                        const copy = [...cases];
                        copy[idx] = savedCase;
                        return copy;
                    }
                    return [savedCase, ...cases];
                })();

                setCases(updatedCases);
                localStorage.setItem("clinical_sp_cases", JSON.stringify(updatedCases));
                setActiveTab("cases");
                showToast("症例を正常に保存しました。（ブラウザに保管）");
            };

            if (isLoading) {
                return (
                    <div class="min-h-screen bg-slate-900 flex flex-col items-center justify-center text-white p-4">
                        <i class="fa-solid fa-spinner fa-spin text-4xl text-teal-400 mb-4"></i>
                        <p class="text-sm font-bold tracking-wider">最新の症例データベースを読み込み中...</p>
                    </div>
                );
            }

            return (
                <div class="min-h-screen flex flex-col bg-slate-50">
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} onClearCache={handleClearCache} />

                    <main class="flex-1 flex flex-col">
                        {activeTab === "home" && (
                            <HomeScreen 
                                cases={cases} 
                                onStartSolo={handleStartSolo} 
                                onStartPair={handleStartPair}
                                onCreateNew={() => { setEditingCase(null); setActiveTab("edit"); }}
                            />
                        )}

                        {activeTab === "solo" && selectedCase && (
                            <SoloModeScreen 
                                currentCase={selectedCase} 
                                onBack={() => setActiveTab("home")} 
                            />
                        )}

                        {activeTab === "pair" && selectedCase && (
                            <PairModeScreen 
                                currentCase={selectedCase} 
                                onBack={() => setActiveTab("home")} 
                            />
                        )}

                        {activeTab === "cases" && (
                            <CaseManagerScreen 
                                cases={cases} 
                                setCases={(newCases) => {
                                    setCases(newCases);
                                    localStorage.setItem("clinical_sp_cases", JSON.stringify(newCases));
                                }}
                                onEditCase={(c) => { setEditingCase(c); setActiveTab("edit"); }}
                                onCreateCase={() => { setEditingCase(null); setActiveTab("edit"); }}
                                onClearCache={handleClearCache}
                            />
                        )}

                        {activeTab === "edit" && (
                            <CaseEditorScreen 
                                editingCase={editingCase}
                                onSave={handleSaveCase}
                                onCancel={() => setActiveTab("cases")}
                            />
                        )}
                    </main>

                    {toast && (
                        <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById("root");
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
